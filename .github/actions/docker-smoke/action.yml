# Composite action: build the repo's Docker image, run the container, and verify
# it actually serves an HTTP request sent with the PRODUCTION Host header.
#
# This catches two whole classes of bug that a plain "build" check cannot:
#   1. Image build breaks (e.g. a base-image bump that drops a tool the
#      Dockerfile relies on) — caught by `docker build`.
#   2. Runtime serving breaks that only appear when the container actually runs
#      under its real hostname (e.g. Vite's preview `allowedHosts` rejecting an
#      unlisted Host with 403) — caught by curling with `Host: <host>`.
#
# Optionally, `smoke-command` runs a deeper check against the running container
# (e.g. a crawl of every page), and `fail-on-log-pattern` fails on server log
# lines such as a missing module that a page may swallow while still answering
# 200. Whenever a step fails, the last 200 lines of the container log are
# printed.
#
# Used as a STEP inside the job whose name is the required status check (`ci`
# under the org ruleset) so the context stays exactly that name (a reusable
# workflow would produce `ci / <job>` and break the required-check match).
name: Docker image smoke test
description: Build the Docker image, run it, and assert it serves the production Host with the expected HTTP status.

inputs:
  host:
    description: Host header to send — the production hostname the app is served under.
    required: true
  port:
    description: Container port to publish and probe.
    required: false
    default: "8080"
  path:
    description: Request path to probe.
    required: false
    default: "/"
  expected-status:
    description: HTTP status code the probe must return.
    required: false
    default: "200"
  dockerfile:
    description: Path to the Dockerfile.
    required: false
    default: "Dockerfile"
  context:
    description: Docker build context.
    required: false
    default: "."
  startup-timeout:
    description: Seconds to wait for the container to start responding.
    required: false
    default: "90"
  build-only:
    description: >-
      When "true", only build the image and skip running/probing it. Use for
      apps that can't boot standalone in CI (need runtime secrets, a database,
      etc.). Catches image-build breaks (e.g. a base-image bump dropping a tool
      the Dockerfile needs) without requiring the container to serve.
    required: false
    default: "false"
  smoke-command:
    description: >-
      Shell command run with bash after the Host-header probe succeeds, from the
      workspace root, with SMOKE_BASE_URL=http://localhost:<port> in its
      environment. A non-zero exit fails the action. Empty (the default) skips
      it. Ignored when build-only is "true".
    required: false
    default: ""
  fail-on-log-pattern:
    description: >-
      Extended regex (grep -E). After the probe and smoke-command, the action
      fails if the container log matches it, e.g.
      "MODULE_NOT_FOUND|Cannot find module". Empty (the default) skips the
      check. Ignored when build-only is "true".
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Build image
      shell: bash
      run: docker build -f "${{ inputs.dockerfile }}" -t ci-smoke:latest "${{ inputs.context }}"

    - name: Run container
      if: ${{ inputs.build-only != 'true' }}
      shell: bash
      run: docker run -d --name ci-smoke -p "${{ inputs.port }}:${{ inputs.port }}" ci-smoke:latest

    - name: Probe with production Host header
      if: ${{ inputs.build-only != 'true' }}
      shell: bash
      env:
        SMOKE_HOST: ${{ inputs.host }}
        SMOKE_PORT: ${{ inputs.port }}
        SMOKE_PATH: ${{ inputs.path }}
        SMOKE_EXPECTED: ${{ inputs.expected-status }}
        SMOKE_TIMEOUT: ${{ inputs.startup-timeout }}
      run: |
        set -euo pipefail
        deadline=$((SECONDS + SMOKE_TIMEOUT))
        code=000
        while [ "$SECONDS" -lt "$deadline" ]; do
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Host: ${SMOKE_HOST}" \
            "http://localhost:${SMOKE_PORT}${SMOKE_PATH}" || echo 000)
          if [ "$code" = "$SMOKE_EXPECTED" ]; then
            echo "✓ Got expected HTTP ${SMOKE_EXPECTED} for Host: ${SMOKE_HOST}"
            exit 0
          fi
          echo "waiting for container… (got ${code}, want ${SMOKE_EXPECTED})"
          sleep 3
        done
        echo "::error::Smoke test failed: got HTTP ${code} for Host: ${SMOKE_HOST}${SMOKE_PATH} (expected ${SMOKE_EXPECTED})"
        exit 1

    # The command is caller-supplied, so it goes through `env` and is run by an
    # inner bash, never spliced into this script body.
    - name: Run smoke command
      if: ${{ inputs.build-only != 'true' && inputs.smoke-command != '' }}
      shell: bash
      env:
        SMOKE_COMMAND: ${{ inputs.smoke-command }}
        SMOKE_BASE_URL: http://localhost:${{ inputs.port }}
      run: bash -eo pipefail -c "$SMOKE_COMMAND"

    - name: Check container log
      if: ${{ inputs.build-only != 'true' && inputs.fail-on-log-pattern != '' }}
      shell: bash
      env:
        SMOKE_LOG_PATTERN: ${{ inputs.fail-on-log-pattern }}
      run: |
        set -uo pipefail
        if ! logs=$(docker logs ci-smoke 2>&1); then
          echo "::error::Could not read the container log"
          exit 1
        fi
        matches=$(printf '%s\n' "$logs" | grep -E -- "$SMOKE_LOG_PATTERN")
        rc=$?
        if [ "$rc" -eq 0 ]; then
          printf '%s\n' "$matches"
          echo "::error::The container log matches fail-on-log-pattern: ${SMOKE_LOG_PATTERN}"
          exit 1
        elif [ "$rc" -ne 1 ]; then
          echo "::error::grep failed on fail-on-log-pattern: ${SMOKE_LOG_PATTERN}"
          exit 1
        fi
        echo "✓ No container log line matches: ${SMOKE_LOG_PATTERN}"

    - name: Container logs
      if: ${{ failure() && inputs.build-only != 'true' }}
      shell: bash
      run: |
        if docker container inspect ci-smoke >/dev/null 2>&1; then
          echo "=== last 200 lines of the container log ==="
          docker logs --tail 200 ci-smoke 2>&1 || true
        fi

    - name: Tear down container
      if: ${{ always() && inputs.build-only != 'true' }}
      shell: bash
      run: docker rm -f ci-smoke >/dev/null 2>&1 || true
